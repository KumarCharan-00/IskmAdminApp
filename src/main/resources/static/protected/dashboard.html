<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Content Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="../protected/css/dashboard-icon.css" rel="stylesheet" />
</head>
<body class="bg-light">
  <div class="container py-5">
    <h1 class="text-center mb-4">Manage Content</h1>
    <div class="d-flex justify-content-center gap-1">
      <button class="btn btn-lg btn-subtle-primary" onclick="uploadContent()">Upload New Content</button>
      <button class="btn btn-lg btn-subtle-success" onclick="showUploaded()">Show Uploaded Content</button>
      <button class="btn btn-lg btn-subtle-warning" onclick="showDrafts()">Show Drafts</button>
    </div>
    <div id="output" class="mt-5 p-4 bg-white border rounded shadow-sm d-none"></div>
  </div>
  <script>
    function uploadContent() {
      showMessage("Upload form or modal would appear here.");
    }

    function showUploaded() {
      showMessage("List of uploaded content would be displayed here.");
    }

    function showDrafts() {
      showMessage("Draft items would be shown here.");
    }

    function showMessage(message) {
      const output = document.getElementById("output");
      output.classList.remove("d-none");
      output.textContent = message;
    }
  </script>
</body>
</html>
