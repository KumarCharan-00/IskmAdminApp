<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Content Dashboard</title>

        <!-- jQuery (needed for datepicker only) -->
        <script defer src="https://code.jquery.com/jquery-3.7.1.js"></script>

        <!-- Bootstrap Core -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
            rel="stylesheet"
        />
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

        <!-- Bootstrap Icons -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"
            rel="stylesheet"
        />

        <!-- Bootstrap Datepicker -->
        <link
            href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-datepicker/1.9.0/css/bootstrap-datepicker.standalone.min.css"
            rel="stylesheet"
        />
        <script
            defer
            src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-datepicker/1.9.0/js/bootstrap-datepicker.min.js"
        ></script>

        <!-- DataTables v2 (vanilla JS) -->
        <link
            rel="stylesheet"
            href="https://cdn.datatables.net/2.3.4/css/dataTables.bootstrap5.min.css"
        />
        <script
            defer
            src="https://cdn.datatables.net/2.3.4/js/dataTables.min.js"
        ></script>
        <script
            defer
            src="https://cdn.datatables.net/2.3.4/js/dataTables.bootstrap5.min.js"
        ></script>

        <script type="module" src="../protected/js/common-util.js"></script>
        <script type="module" src="../protected/js/upload-content.js"></script>
        <script type="module" src="../protected/js/view-content.js"></script>
        <link href="../protected/css/content.css" rel="stylesheet" />
    </head>
    <body class="bg-light">
        <div class="container py-5">
            <h1 class="text-left mb-4">Manage Content</h1>
            <div class="btn-group" role="group" aria-label="Content actions">
                <button
                    type="button"
                    id="btn-upload"
                    class="btn btn-subtle-primary"
                    data-bs-toggle="collapse"
                    data-bs-target="#output"
                    onclick="addContent()"
                >
                    Upload New Content
                </button>
                <button
                    type="button"
                    id="btn-show-uploaded"
                    class="btn btn-subtle-primary"
                    data-bs-toggle="collapse"
                    data-bs-target="#output"
                    onclick="viewContent([])"
                >
                    View Content
                </button>
            </div>
            <div id="add-content" class="output collapse">
                <div class="d-flex align-items-center my-3">
                    <div
                        class="btn-group shadow-sm"
                        role="group"
                        aria-label="Content Type"
                    >
                        <button
                            class="btn btn-subtle-primary dropdown-toggle"
                            type="button"
                            data-bs-toggle="dropdown"
                            aria-expanded="false"
                            id="typeDropdownBtn"
                        >
                            Festival
                        </button>
                        <ul class="type-options dropdown-menu">
                            <li class="dropdown-item selected">Festival</li>
                            <li class="dropdown-item">Blog</li>
                            <li class="dropdown-item">Seva</li>
                        </ul>
                    </div>
                </div>
                <div id="alertContainer"></div>
                <form
                    id="contentUploadForm"
                    action="/content"
                    method="post"
                    enctype="multipart/form-data"
                    class="mt-3 p-4 bg-white border rounded shadow-sm"
                >
                    <div class="row g-2 mb-3">
                        <div class="col-md">
                            <div class="form-floating">
                                <input
                                    class="form-control"
                                    id="contentTitle"
                                    name="title"
                                    placeholder="Title"
                                    required
                                />
                                <label for="contentTitle">Title</label>
                            </div>
                        </div>
                        <div class="col-md" id="locationContainer">
                            <div class="form-floating">
                                <input
                                    class="form-control"
                                    id="contentLocation"
                                    name="location"
                                    placeholder="Location"
                                />
                                <label for="contentLocation">Location</label>
                            </div>
                        </div>
                    </div>
                    <div class="d-none mb-3" id="sevaOptionsContainer">
                        <div class="row g-2 mb-3">
                            <div class="col-md">
                                <label for="sevaSelect" class="form-label">Seva</label>
                                <select class="form-select" id="sevaSelect">
                                    <option value="" selected disabled>Select Seva</option>
                                    <option value="new">+ Add New Seva</option>
                                </select>
                                <input type="text" class="form-control mt-2 d-none" id="newSevaName" placeholder="Enter new Seva name" />
                            </div>
                            <div class="col-md">
                                <label for="sevaSubTypeSelect" class="form-label">Sub Type</label>
                                <select class="form-select" id="sevaSubTypeSelect" disabled>
                                    <option value="" selected disabled>Select Sub Type</option>
                                    <option value="new">+ Add New Sub Type</option>
                                </select>
                                <div id="newSubTypeContainer" class="d-none mt-2">
                                    <input type="text" class="form-control mb-2" id="newSubTypeName" placeholder="Enter new Sub Type name" />
                                    <div class="input-group mb-2" id="newSubTypeAmountContainer">
                                        <span class="input-group-text">₹</span>
                                        <input type="number" class="form-control" id="newSubTypeAmount" placeholder="Amount" />
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" id="newSubTypeGeneralDonation" />
                                        <label class="form-check-label" for="newSubTypeGeneralDonation">General Donation (Any Amount)</label>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="form-check form-switch mb-2">
                            <input
                                class="form-check-input"
                                type="checkbox"
                                role="switch"
                                id="sevaNeverExpiryOption"
                                aria-checked="false"
                            />
                            <label
                                class="form-check-label"
                                for="sevaNeverExpiryOption"
                                >Never expiry</label
                            >
                        </div>
                    </div>
                    <div class="row g-2 mb-3" id="dateContainer">
                        <div id="dateHelpText" class="form-text mb-2"></div>
                        <div class="col-md">
                            <div class="form-floating">
                                <input
                                    type="text"
                                    class="form-control calendarInput"
                                    id="contentStartDate"
                                    name="startDate"
                                    placeholder="Start Date"
                                />
                                <label for="contentStartDate">From Date</label>
                            </div>
                        </div>
                        <div class="col-md">
                            <div class="form-floating">
                                <input
                                    type="text"
                                    class="form-control calendarInput"
                                    id="contentEndDate"
                                    name="endDate"
                                    placeholder="End Date"
                                />
                                <label for="contentEndDate">Till Date</label>
                            </div>
                        </div>
                    </div>

                    <div
                        class="form-check form-switch mb-3"
                        id="donationContainer"
                    >
                        <input
                            class="form-check-input"
                            type="checkbox"
                            role="switch"
                            id="contentDonationOption"
                            name="showDonation"
                            aria-checked="false"
                        />
                        <label
                            class="form-check-label"
                            for="contentDonationOption"
                            >Show donation option</label
                        >
                    </div>

                    <div class="form-floating mb-3" id="quoteContainer">
                        <textarea
                            class="form-control"
                            placeholder="Quote"
                            id="contentQuote"
                            name="quote"
                            style="height: 4rem"
                        ></textarea>
                        <label for="contentQuote">Quote</label>
                    </div>

                    <div class="form-floating mb-3" id="previewContainer">
                        <textarea
                            class="form-control"
                            placeholder="Preview Text"
                            id="contentPreview"
                            name="previewText"
                            style="height: 4rem"
                        ></textarea>
                        <label for="contentPreview"
                            >Preview Text <i>(20 words)</i></label
                        >
                    </div>

                    <div class="form-floating mb-3">
                        <textarea
                            class="form-control"
                            placeholder="Content"
                            id="contentBody"
                            name="content"
                            style="height: 10rem"
                        ></textarea>
                        <label for="contentBody">Content / Information</label>
                    </div>

                    <!-- [START] Image Upload -->
                    <div class="mb-3">
                        <label for="imageUpload" class="form-label"
                            >Images</label
                        >
                        <input
                            type="file"
                            class="form-control"
                            id="imageUpload"
                            name="images"
                            multiple
                            accept="image/*"
                            onchange="displayImageNames()"
                        />
                    </div>
                    <ul
                        id="imageList"
                        class="list-group mb-3 flex-wrap flex-row"
                    ></ul>
                    <!-- [END] Image Upload -->
                    <div id="imagePreview" class="carousel slide d-none">
                        <div
                            class="carousel-inner"
                            style="background-color: #202123"
                        ></div>
                        <button
                            class="carousel-control-prev"
                            type="button"
                            data-bs-target="#imagePreview"
                            data-bs-slide="prev"
                        >
                            <span
                                class="carousel-control-prev-icon"
                                aria-hidden="true"
                            ></span>
                            <span class="visually-hidden">Previous</span>
                        </button>
                        <button
                            class="carousel-control-next"
                            type="button"
                            data-bs-target="#imagePreview"
                            data-bs-slide="next"
                        >
                            <span
                                class="carousel-control-next-icon"
                                aria-hidden="true"
                            ></span>
                            <span class="visually-hidden">Next</span>
                        </button>
                    </div>
                    <div class="mt-3">
                        <div
                            class="d-flex justify-content-end gap-2"
                            aria-label="Submit Content"
                        >
                            <button
                                type="button"
                                class="btn btn-outline-danger btn-sm"
                                onclick="clearContentForm()"
                            >
                                Clear
                            </button>
                            <button
                                type="button"
                                class="btn btn-outline-secondary btn-sm"
                                onclick="saveAsDraft()"
                            >
                                Save as Draft
                            </button>
                            <button
                                type="button"
                                class="btn btn-primary btn-sm"
                                onclick="saveAndUpload()"
                            >
                                Save and Upload
                            </button>
                        </div>
                    </div>
                </form>
            </div>
            <div id="view-content" class="output collapse">
                <div
                    class="d-flex flex-column justify-content-center align-items-start flex-md-row justify-content-md-end align-items-md-center gap-2"
                >
                    <div
                        class="d-inline-flex flex-column align-items-start me-auto mt-3"
                    >
                        <div
                            class="btn-group shadow-sm me-auto"
                            role="group"
                            aria-label="Content actions"
                        >
                            <button
                                class="btn btn-subtle-primary dropdown-toggle"
                                type="button"
                                data-bs-toggle="dropdown"
                                aria-expanded="false"
                            >
                                Status
                            </button>
                            <ul class="status-options dropdown-menu">
                                <li class="dropdown-item">Published</li>
                                <li class="dropdown-item">Draft</li>
                                <li class="dropdown-item">Expired</li>
                            </ul>
                        </div>
                    </div>
                    <div
                        class="d-inline-flex flex-column flex-sm-row mt-3 gap-2"
                    >
                        <div
                            class="startDatePicker input-group"
                            style="max-width: 14rem; min-width: 11rem"
                        >
                            <input
                                type="text"
                                class="calendarInput form-control border-secondary-subtle shadow-sm"
                                id="calendarStartDate"
                                placeholder="Start Date"
                            />
                            <label
                                for="calendarStartDate"
                                class="visually-hidden"
                                >Start Date</label
                            >
                            <span
                                class="input-group-text border-secondary-subtle shadow-sm"
                                onclick="clearStartDate()"
                                ><i class="bi bi-trash"></i
                            ></span>
                        </div>
                        <div
                            class="endDatePicker input-group"
                            style="max-width: 14rem; min-width: 11rem"
                        >
                            <input
                                type="text"
                                class="calendarInput form-control border-secondary-subtle shadow-sm"
                                id="calendarEndDate"
                                placeholder="End Date"
                            />
                            <label for="calendarEndDate" class="visually-hidden"
                                >End Date</label
                            >
                            <span
                                class="input-group-text border-secondary-subtle shadow-sm"
                                onclick="clearEndDate()"
                                ><i class="bi bi-trash"></i
                            ></span>
                        </div>
                    </div>
                    <button
                        type="button"
                        class="btn btn-outline-secondary mt-3"
                        id="ApplyFilters"
                    >
                        Apply
                    </button>
                </div>
                <div
                    class="selected-item-list d-flex flex-row justify-content-start align-items-center gap-2"
                ></div>
                <div
                    class="table-responsive mt-3 p-4 bg-white border rounded shadow-sm"
                >
                    <div
                        class="modal fade"
                        id="viewContentModal"
                        tabindex="-1"
                        aria-labelledby="viewContentModalLabel"
                        aria-hidden="true"
                    >
                        <div
                            class="modal-dialog modal-dialog-centered modal-xl modal-dialog-scrollable"
                        >
                            <div class="modal-content">
                                <div class="modal-header">
                                    <h1
                                        class="modal-title fs-5 text-dark contentModalTitle"
                                    >
                                        <label
                                            for="viewContentModalInput"
                                            id="viewContentModalLabel"
                                        ></label>
                                        <span
                                            id="viewContentModalInputGrp"
                                            class="input-group visually-hidden"
                                        >
                                            <input
                                                type="text"
                                                id="viewContentModalInput"
                                                class="input-text form-control"
                                                placeholder
                                                readonly
                                            />
                                            <button
                                                type="button"
                                                class="btn btn-outline-primary btn-sm"
                                                onclick="
                                                    editContentModalTitle(true)
                                                "
                                            >
                                                <i class="bi bi-check2"></i>
                                            </button>
                                            <button
                                                type="button"
                                                class="btn btn-outline-danger btn-sm"
                                                onclick="
                                                    editContentModalTitle(false)
                                                "
                                            >
                                                <i class="bi bi-x"></i>
                                            </button>
                                        </span>
                                        <span
                                            id="editContentModalTitleIcon"
                                            class="text-dark"
                                            onclick="editContentModalTitle()"
                                            ><a href="#"
                                                ><i
                                                    class="bi bi-pencil-square"
                                                ></i></a
                                        ></span>
                                    </h1>
                                    <!--<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>-->
                                </div>
                                <div
                                    id="viewContentModalDynamicBody"
                                    class="modal-body d-flex flex-column gap-3 p-3"
                                ></div>
                                <div class="modal-footer">
                                    <button
                                        type="button"
                                        class="btn btn-outline-danger btn-sm modalCloseBtn"
                                        data-bs-target="#viewContentModal"
                                        aria-label="Close"
                                    >
                                        Close
                                    </button>
                                    <button
                                        type="button"
                                        class="btn btn-outline-secondary btn-sm modalStateBtn"
                                    >
                                        Edit
                                    </button>
                                    <button
                                        type="button"
                                        class="btn btn-outline-secondary btn-sm saveModifiedContentBtn"
                                        disabled
                                    >
                                        Save changes
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div
                        class="modal fade"
                        id="viewImagesModal"
                        tabindex="-1"
                        aria-labelledby="viewImagesModalLabel"
                        aria-hidden="true"
                    >
                        <div
                            class="modal-dialog modal-dialog-centered modal-lg modal-dialog-scrollable"
                        >
                            <div class="modal-content">
                                <div class="modal-header">
                                    <h1
                                        class="modal-title fs-5 text-dark"
                                        id="viewImagesModalLabel"
                                    >
                                        Manage Images
                                    </h1>
                                    <button
                                        type="button"
                                        class="btn-close"
                                        data-bs-dismiss="modal"
                                        aria-label="Close"
                                    ></button>
                                </div>
                                <div class="modal-body p-3">
                                    <div class="mb-4">
                                        <label
                                            for="newImagesUpload"
                                            class="form-label fw-bold"
                                            >Upload New Images</label
                                        >
                                        <div class="input-group">
                                            <input
                                                type="file"
                                                class="form-control"
                                                id="newImagesUpload"
                                                multiple
                                                accept="image/*"
                                            />
                                            <button
                                                class="btn btn-primary"
                                                type="button"
                                                id="btnUploadNewImages"
                                            >
                                                Upload
                                            </button>
                                        </div>
                                    </div>
                                    <div
                                        id="viewImagesModalDynamicBody"
                                        class="d-flex flex-wrap gap-3 justify-content-center"
                                    ></div>
                                </div>
                                <div class="modal-footer">
                                    <button
                                        type="button"
                                        class="btn btn-outline-secondary btn-sm"
                                        data-bs-dismiss="modal"
                                    >
                                        Close
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                    <table id="contentTable" class="table">
                        <thead>
                            <tr>
                                <th scope="col">#</th>
                                <th scope="col">Title</th>
                                <th scope="col">State</th>
                                <th scope="col">Type</th>
                                <th scope="col">Actions</th>
                                <th scope="col">Images</th>
                                <th scope="col">Created On</th>
                            </tr>
                        </thead>
                        <tbody class="content-data"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </body>
</html>
