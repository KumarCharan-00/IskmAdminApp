<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Content Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <link href="css/content.css" rel="stylesheet" />
</head>
<body class="bg-light">
  <div class="container py-5">
    <h1 class="text-left mb-4">Manage Content</h1>
    <div class="btn-group" role="group" aria-label="Content actions">
      <button type="button" id="btn-upload" class="btn btn-subtle-primary"
              data-bs-toggle="collapse" data-bs-target="#output" onclick="uploadContent()">Upload New Content</button>
      <button type="button" id="btn-show-uploaded" class="btn btn-subtle-primary"
              data-bs-toggle="collapse" data-bs-target="#output" onclick="showUploaded()">Show Uploaded Content</button>
      <button type="button" id="btn-show-drafts" class="btn btn-subtle-primary"
              data-bs-toggle="collapse" data-bs-target="#output" onclick="showDrafts()">Show Drafts</button>
    </div>
    <div id="add-content" class="output collapse mt-3 p-4 bg-white border rounded shadow-sm">
      <form id="contentUploadForm" action="/content" method="post" enctype="multipart/form-data">
        <div class="row g-2">
          <div class="col-md">
            <div class="form-floating mb-3">
              <input class="form-control" id="floatingTitleLabel" name="content-title" placeholder="Page Name" required>
              <label for="floatingTitleLabel">Page Title</label>
            </div>
          </div>
        </div>
        <div class="form-floating">
          <textarea class="form-control" placeholder="Leave a comment here" id="floatingTextArea" style="height: 10rem;"></textarea>
          <label for="floatingTextArea">Page Content</label>
        </div>
        <!-- [START] Image Upload -->
        <div class="mb-3">
          <label for="imageUpload" class="form-label"></label>
          <input type="file" class="form-control" id="imageUpload" name="images" multiple accept="image/*" onchange="displayImageNames()" />
        </div>
        <ul id="imageList" class="list-group mb-3 flex-wrap flex-row"></ul>
        <!-- [END] Image Upload -->
        <div id="imagePreview" class="carousel slide">
          <div class="carousel-inner " style="background-color: #202123"></div>
            <button class="carousel-control-prev" type="button" data-bs-target="#imagePreview" data-bs-slide="prev">
              <span class="carousel-control-prev-icon" aria-hidden="true"></span>
              <span class="visually-hidden">Previous</span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#imagePreview" data-bs-slide="next">
              <span class="carousel-control-next-icon" aria-hidden="true"></span>
              <span class="visually-hidden">Next</span>
            </button>
        </div>
        <div class="mt-3">
          <div class="d-flex justify-content-end gap-2" aria-label="Submit Page Content">
            <button type="button" class="btn btn-outline-danger btn-sm" onclick="clearContentForm()">Clear</button>
            <button type="button" class="btn btn-outline-secondary btn-sm">Save as Draft</button>
            <button type="button" class="btn btn-primary btn-sm">Save and Upload</button>
          </div>
        </div>
      </form>
    </div>
    <div id="view-content" class="output collapse mt-3 p-4 bg-white border rounded shadow-sm">

    </div>
  </div>
  <script src="js/content.js"></script>
</body>
</html>
