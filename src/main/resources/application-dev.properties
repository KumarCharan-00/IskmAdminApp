# server.port=8080
spring.application.name=web

# Live Reload
spring.devtools.livereload.enabled=true

# Disable using db during startup
spring.sql.init.mode=never

# Connection pool settings - allow startup even if DB is down
spring.datasource.hikari.initialization-fail-timeout=-1
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

# Lazy initialization - DB connection happens on first use
spring.main.lazy-initialization=true

# PostgreSQL database configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/IskmAdminDb
spring.datasource.username=${postgresql.username}
spring.datasource.password=${postgresql.password}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# JPA/Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# RazorPay Secrets
razorpay.key.id=${razorpay.key.id}
razorpay.key.secret=${razorpay.key.secret}

# Cors Config
allowed.endpoints.list=http://localhost:5173