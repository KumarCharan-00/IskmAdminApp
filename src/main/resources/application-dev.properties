# server.port=8080
spring.application.name=web

# Live Reload
spring.devtools.livereload.enabled=false

# Disable using db during startup
spring.sql.init.mode=never

# Lazy initialization - DB connection happens on first use
spring.main.lazy-initialization=true

# PostgreSQL database configuration
spring.datasource.url=${postgresql.url}?createDatabaseIfNotExist=true
spring.datasource.username=${postgresql.username}
spring.datasource.password=${postgresql.password}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# JPA/Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# RazorPay Secrets
razorpay.key.id=${razorpay.key.id}
razorpay.key.secret=${razorpay.key.secret}

# Cors Config
allowed.endpoints.list=${allowed.endpoints.list}