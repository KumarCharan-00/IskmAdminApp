# server.port=8080
spring.application.name=web

# Live Reload
spring.devtools.livereload.enabled=true

# PostgreSQL database configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/IskmAdminDb?createDatabaseIfNotExist=true
spring.datasource.username=${postgresql.username}
spring.datasource.password=${postgresql.password}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true


# JPA/Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# RazorPay Secrets
razorpay.key.id=${razorpay.key.id}
razorpay.key.secret=${razorpay.key.secret}

# Cors Config
allowed.endpoints.list=http://localhost:5173

